# XcodeGen spec. The .xcodeproj is generated from this file (locally or in CI)
# and is not committed, so there are no merge-unfriendly project files in git.
name: Botanica
options:
  bundleIdPrefix: com.nitish
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Botanica:
    type: application
    platform: iOS
    sources:
      - path: Botanica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nitish.botanica
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Botanica
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ENABLE_PREVIEWS: YES
